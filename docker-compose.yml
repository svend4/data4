version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: budgetassist-db
    environment:
      POSTGRES_DB: budgetassist
      POSTGRES_USER: ${DB_USER:-budgetassist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetassist"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetassist-network

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: budgetassist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - budgetassist-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: budgetassist-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: budgetassist
      DB_USER: ${DB_USER:-budgetassist}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - /app/node_modules
    networks:
      - budgetassist-network

  # Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: budgetassist-frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - budgetassist-network

volumes:
  postgres_data:
  redis_data:

networks:
  budgetassist-network:
    driver: bridge
